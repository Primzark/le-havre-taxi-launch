    <script>
      (function () {
        var href = "./favicon.ico?v=20260212-taxilogo-force3-" + Date.now();
        var selectors = 'link[rel~="icon"],link[rel="shortcut icon"],link[rel="apple-touch-icon"]';
        var links = document.querySelectorAll(selectors);
        for (var i = 0; i < links.length; i += 1) {
          if (links[i] && links[i].parentNode) {
            links[i].parentNode.removeChild(links[i]);
          }
        }
        var rels = ["icon", "shortcut icon", "apple-touch-icon"];
        for (var j = 0; j < rels.length; j += 1) {
          var link = document.createElement("link");
          link.setAttribute("rel", rels[j]);
          link.setAttribute("href", href);
          if (rels[j] === "icon") {
            link.setAttribute("type", "image/x-icon");
          }
          document.head.appendChild(link);
        }
      })();
    </script>
